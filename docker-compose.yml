services:
  db:
    # pgvector image = Postgres 15 + the `vector` extension needed for knowledge_chunks embeddings
    image: pgvector/pgvector:pg15
    container_name: metarouter_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: metarouter_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d metarouter_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - metarouter_net

  redis:
    image: redis:7-alpine
    container_name: metarouter_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - metarouter_net

  backend:
    build: ./backend
    container_name: metarouter_backend
    command: sh -c "python -m alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
      - media_data:/data/media
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    # Override the localhost URLs in .env with the compose service hostnames
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/metarouter_db
      REDIS_URL: redis://redis:6379/0
      FRONTEND_BASE_URL: http://localhost
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - metarouter_net

  celery_worker:
    build: ./backend
    container_name: metarouter_celery
    command: celery -A app.workers.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
      - media_data:/data/media
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/metarouter_db
      REDIS_URL: redis://redis:6379/0
      FRONTEND_BASE_URL: http://localhost
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Wait for the backend so migrations have run before tasks touch the DB
      backend:
        condition: service_started
    networks:
      - metarouter_net

  frontend:
    build: ./frontend
    container_name: metarouter_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - metarouter_net

volumes:
  postgres_data:
  media_data:

networks:
  metarouter_net:
    driver: bridge

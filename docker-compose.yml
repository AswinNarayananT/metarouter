version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: metarouter_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: metarouter_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - metarouter_net

  redis:
    image: redis:7-alpine
    container_name: metarouter_redis
    ports:
      - "6379:6379"
    networks:
      - metarouter_net

  backend:
    build: ./backend
    container_name: metarouter_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    networks:
      - metarouter_net

  celery_worker:
    build: ./backend
    container_name: metarouter_celery
    command: celery -A app.workers.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    networks:
      - metarouter_net

  frontend:
    build: ./frontend
    container_name: metarouter_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - metarouter_net

volumes:
  postgres_data:

networks:
  metarouter_net:
    driver: bridge